name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 고객사 설치 환경이 제각각이라는 가정으로 여러 런타임 버전을 함께 검증한다.
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
