# 출발지 프록시 설정(#14). 두 컨테이너가 같은 파일을 쓰고, 출발지는 컨테이너의 고정 IP로 갈린다.
Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 50
# 워커는 호스트에서 포트(127.0.0.1:3128·3129)로 들어온다. 컨테이너가 보는 호스트 주소는 런타임마다
# 다르므로(colima는 VM 게이트웨이) 사설 대역을 다 받는다. 호스트 포트는 127.0.0.1에만 공개한다.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# undici 8.10.2 ProxyAgent는 http 대상에 CONNECT를 쓰지 않고 절대 경로 요청으로 보낸다(proxyTunnel 기본 꺼짐).
# tinyproxy는 그 요청마다 대상 서버로 새 연결을 연다(d3-origin.md 2절 H2). CONNECT는 대상 서버 포트만 연다.
ConnectPort 8080
# 요청을 고치지 않는다. 대상 서버는 X-Forwarded-For를 보지 않지만(target/app.ts originOf) 싣지도 않는다.
DisableViaHeader Yes
LogLevel Info
