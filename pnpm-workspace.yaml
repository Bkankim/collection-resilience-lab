packages:
  - '.'

# pnpm 11은 package.json의 pnpm 필드를 읽지 않고, 키도 onlyBuiltDependencies가 아닌 allowBuilds다.
allowBuilds:
  esbuild: true
  # bullmq → msgpackr가 쓰는 네이티브 가속. install 스크립트는 prebuilt(@msgpackr-extract/*-플랫폼)가
  # 없을 때 node-gyp로 컴파일하는 것뿐이고, prebuilt는 optional 의존성으로 이미 깔린다. 컴파일
  # 도구가 없는 러너에서 스크립트가 실패할 여지를 남기지 않으려고 끈다. prebuilt도 못 찾으면
  # msgpackr는 순수 JS로 돈다.
  msgpackr-extract: false
